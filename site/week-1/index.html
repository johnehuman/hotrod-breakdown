<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hot Rod Week 1 Breakdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Playfair+Display:wght@900&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: single centered column with the issue's pages stacked, prev/next links above and below */
:root{--bg:#f4f3ef;--card:#ffffff;--ink:#1d1d1f;--muted:#5f6168;--line:#e2e0da;--accent:#c8102e;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif;--serif:"Playfair Display",Georgia,serif;--body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
.mast{background:var(--card);text-align:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.kicker{font:700 12px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--accent)}
h1{margin:4px 0 0;font:800 clamp(28px,6vw,44px)/1.05 var(--display);letter-spacing:-.01em}
.byline{font-size:13px;color:var(--muted);margin-top:4px}
.rule{max-width:760px;margin:12px auto 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);height:6px}
main{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.bar a{font:600 14px var(--display);color:var(--ink);text-decoration:none;border:1px solid var(--ink);background:var(--card);padding:8px 12px;border-radius:2px}
.bar a.pdf{background:var(--ink);color:var(--card)}
.bar span{min-width:1px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.page img{display:block;width:100%;height:auto}
.note{color:var(--muted);font-size:14px;text-align:center;margin:0}
</style>
</head>
<body>
<header class="mast">
  <div class="kicker"><b>Hot Rod</b> · Fantasy Football Boys · 2026 Season</div>
  <h1>Week 1 Breakdown</h1>
  <div class="byline">Sept 11, 2026 · Original PDF edition</div>
  <div class="rule"></div>
</header>
<main>
  <div class="bar"><span></span><a href="/archive/">All issues</a><a href="/week-2/">Week 2 →</a></div>
  <div class="bar" style="justify-content:center"><a class="pdf" href="week-1-breakdown.pdf">Open the PDF</a></div>
  <div class="page"><img src="page-1.jpg" alt="Week 1 Breakdown, page 1: The Rundown, Around the League and the Week 2 preview" width="1275" height="2100"></div>
  <div class="page"><img src="page-2.jpg" alt="Week 1 Breakdown, page 2: standings feature and Week 1 storylines" loading="lazy" width="1275" height="2100"></div>
  <p class="note">Pinch to zoom on a phone, or open the PDF for the sharpest text.</p>
  <div class="bar"><span></span><a href="/archive/">All issues</a><a href="/week-2/">Week 2 →</a></div>
</main>
</body>
</html>
